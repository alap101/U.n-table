<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Schedule Finder</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --border-color: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 600px; }
        header { text-align: center; margin-bottom: 30px; }
        header h1 { color: var(--accent-color); font-size: 1.8rem; margin-bottom: 5px; }
        header p { color: #94a3b8; font-size: 0.9rem; }
        .search-box { background-color: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border-color); margin-bottom: 20px; }
        .section-title { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8; margin-bottom: 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 5px; }
        .row { display: flex; gap: 10px; margin-bottom: 15px; }
        .input-group { flex: 1; }
        input, select { width: 100%; padding: 12px; background-color: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px; color: var(--text-color); font-size: 1rem; outline: none; }
        input:focus, select:focus { border-color: var(--accent-color); }
        .result-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; margin-top: 20px; display: none; }
        .result-header { border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 15px; }
        .result-title { font-size: 1.4rem; font-weight: bold; color: var(--accent-color); }
        .result-code { color: #94a3b8; font-size: 1rem; margin-top: 2px; }
        .info-grid { display: grid; grid-template-columns: repeat(2, 11fr); gap: 15px; }
        .info-item { display: flex; flex-direction: column; }
        .info-label { font-size: 0.8rem; color: #94a3b8; text-transform: uppercase; }
        .info-value { font-size: 1.1rem; font-weight: 600; margin-top: 3px; }
        .no-results { text-align: center; color: #64748b; margin-top: 30px; font-style: italic; }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Exam Finder</h1>
        <p>Find your exam room, date, and time instantly</p>
    </header>

    <div class="search-box">
        <div class="section-title">Option 1: Type Course Title</div>
        <div class="row">
            <div class="input-group" style="flex: 2;">
                <input type="text" id="typeTitle" placeholder="Course Title (e.g. Calculus 2)">
            </div>
            <div class="input-group" style="flex: 1;">
                <input type="text" id="typeSection" placeholder="Sec (e.g. 50)">
            </div>
        </div>
    </div>

    <div class="search-box">
        <div class="section-title">Option 2: Select from Lists</div>
        <div class="row">
            <div class="input-group">
                <select id="selectTitle"><option value="">Select Course Title</option></select>
            </div>
            <div class="input-group">
                <select id="selectSection" disabled><option value="">Select Section</option></select>
            </div>
        </div>
    </div>

    <div id="resultCard" class="result-card">
        <div class="result-header">
            <div id="resTitle" class="result-title">-</div>
            <div id="resCode" class="result-code">-</div>
        </div>
        <div class="info-grid">
            <div class="info-item"><span class="info-label">Section</span><span id="resSection" class="info-value">-</span></div>
            <div class="info-item"><span class="info-label">Room / Hall</span><span id="resRoom" class="info-value" style="color: #4ade80;">-</span></div>
            <div class="info-item"><span class="info-label">Date</span><span id="resDate" class="info-value">-</span></div>
            <div class="info-item"><span class="info-label">Time & Period</span><span id="resTime" class="info-value">-</span></div>
        </div>
    </div>
    <div id="noResults" class="no-results" style="display: none;">No matching exam found.</div>
</div>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
